[project]
name = "nomadready"
version = "0.1.0"
description = "Deep research agent: which cities work for a month of remote work, and which neighborhoods to stay in"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "openai-agents[litellm]>=0.22",
    "google-cloud-aiplatform>=1.40.0",
    "google-cloud-storage>=2.14",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "duckdb>=1.1",
    "mercantile>=1.2",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
markers = ["network: calls a live external API"]
testpaths = ["tests"]
pythonpath = ["."]

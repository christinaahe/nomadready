[project]
name = "nomadready"
version = "0.1.0"
description = "Deep research agent: which cities work for a remote-work stay of a week or more, and which neighborhoods to stay in"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "openai-agents[litellm]>=0.22",
    "google-auth>=2.30",  # LiteLLM signs Vertex AI requests with it
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "duckdb>=1.1",
    "mercantile>=1.2",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
markers = ["network: calls a live external API"]
testpaths = ["tests"]
pythonpath = ["."]
